[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraphene"
version = "0.1.0"
description = "A modular graph construction pipeline for graph-augmented LLM code generation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "networkx>=3.0",
    "pydot<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = [
    "examples/sample_code.py",
    "examples/*.ipynb",
]

[project.optional-dependencies]
cache = ["datasets>=2.0"]
