name: Python Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Install tooling
        run: pip install pytest ruff

      - name: Run linter
        run: ruff check .

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: pytest

