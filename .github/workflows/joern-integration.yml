name: Joern Integration

'on':
  workflow_dispatch:
  pull_request:
  push:

jobs:
  joern-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Install Joern CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/joern"
          curl -sSL "https://github.com/joernio/joern/releases/latest/download/joern-cli.zip" -o "$HOME/joern/joern-cli.zip"
          unzip -q "$HOME/joern/joern-cli.zip" -d "$HOME/joern"
          echo "$HOME/joern/joern-cli" >> "$GITHUB_PATH"
          "$HOME/joern/joern-cli/joern" --help >/dev/null

      - name: Run Joern integration marker tests
        env:
          RUN_REAL_JOERN: "1"
        run: pytest -q -m integration

      - name: Run Joern-backed parser/trimmer checks
        env:
          RUN_REAL_JOERN: "1"
        run: |
          pytest -q tests/test_parsers.py::TestJoernParserUnit::test_build_graph_with_dot_file
          pytest -q tests/test_trimmers.py::test_trimmer_and_serializer_with_joern
