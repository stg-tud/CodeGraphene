name: Joern Integration

'on':
  workflow_dispatch:
  pull_request:
  push:

jobs:
  joern-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Install Joern CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/joern"
          # --fail: error out on a bad HTTP status instead of saving an error
          # page as if it were the zip (that's what silently produced a
          # corrupted joern-cli.zip / "cannot find zipfile directory" before).
          # --retry: GitHub Releases downloads occasionally fail transiently.
          curl -fsSL --retry 3 --retry-delay 5 \
            "https://github.com/joernio/joern/releases/latest/download/joern-cli.zip" \
            -o "$HOME/joern/joern-cli.zip"
          unzip -q "$HOME/joern/joern-cli.zip" -d "$HOME/joern"
          echo "$HOME/joern/joern-cli" >> "$GITHUB_PATH"
          "$HOME/joern/joern-cli/joern" --help >/dev/null

      - name: Run Joern integration marker tests
        env:
          RUN_REAL_JOERN: "1"
        run: pytest -q -m integration

      - name: Run Joern-backed parser/trimmer checks
        env:
          RUN_REAL_JOERN: "1"
        run: |
          # Run the parser and trimmer integration tests at file level to avoid
          # brittle node-id selections that can fail across branches/commits.
          pytest -q tests/test_parsers.py
          pytest -q tests/test_trimmers.py
